name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *" # Berjalan otomatis tiap 12 jam
  workflow_dispatch: # Memungkinkan tombol run manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Galaga/Pacman contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg?game=pacman
            dist/pacman-contribution-graph-dark.svg?game=pacman&palette=github-dark

      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
